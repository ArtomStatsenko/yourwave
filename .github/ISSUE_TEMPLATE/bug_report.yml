name: Bug report
description: Report a problem with playback, the interface, or an integration
body:
  - type: markdown
    attributes:
      value: Do not attach cookies, tokens, secret calendar links, personal events, or your full configuration.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can someone reproduce the problem?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Project commit, macOS, Python, FFmpeg and Liquidsoap versions, music source, and affected integration.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and examples
      description: If useful, attach a redacted log excerpt, screenshot, or short audio example without private content.
