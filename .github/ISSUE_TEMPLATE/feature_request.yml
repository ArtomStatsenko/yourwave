name: Feature request
description: Suggest an improvement or a new use case
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe a concrete use case and what is missing.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected behavior
      description: What would change for the listener or station owner?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and context
      description: What have you tried? Include a relevant example if available.
