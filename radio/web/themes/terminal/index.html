<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yourwave</title>
<link rel="stylesheet" href="/ui/themes/terminal/theme.css">
<script src="/ui/core/core.js"></script>
<script>RadioCore.followSavedTheme('terminal')</script>
<script id="appearance-script">
// Apply before the body is painted; appearance belongs to this browser, not the station.
var appearance=(function(){
  var key='yourwave.appearance',root=document.documentElement,system=matchMedia('(prefers-color-scheme:dark)'),
    tokens=['bg','surface','ink','muted','line','accent','accent-ink'],
    palettes={
      ember:{light:['#f2f2ee','#e7e7e1','#17170f','#5f5f55','#cfcfc5','#c2410c','#ffffff'],dark:['#121210','#1b1a17','#ece8dc','#9a968a','#2e2d27','#ff6a3d','#121210']},
      forest:{light:['#f1f3eb','#e3e8d9','#20271e','#56624f','#c8d1bf','#346347','#ffffff'],dark:['#131b17','#1c2821','#e5eee4','#a0b3a4','#34463b','#93cba5','#132319']},
      ocean:{light:['#edf3f6','#dfe8ee','#192b36','#506575','#c3d1dc','#185e91','#ffffff'],dark:['#111c27','#1b2b3b','#e4edf4','#9db0c2','#334b60','#80bce7','#14283a']}
    },state={mode:'system',palette:'ember',accent:'',presentation:'calm',timelineEffect:'line',timeFormat:'24',crt:'on'},mounted=false,saveError=false;
  function hex(value){return typeof value==='string'&&/^#[0-9a-f]{6}$/i.test(value)}
  var contrast=RadioCore.contrast;
  function mode(){return state.mode==='system'?(system.matches?'dark':'light'):state.mode}
  function colors(){return palettes[state.palette][mode()]}
  function readable(value){var c=colors();return hex(value)&&Math.min(contrast(value,c[0]),contrast(value,c[1]))>=4.5}
  function accent(value){root.style.setProperty('--accent',value);root.style.setProperty('--accent-ink',contrast('#ffffff',value)>=contrast('#121210',value)?'#ffffff':'#121210')}
  // The CRT bend: a barrel displacement map (R and G push x and y) drawn once, the first time the screen is on.
  function crtBend(){var map=el('crt-map');if(!map)return;
    if(state.crt==='on'&&!map.getAttribute('href')){var n=256,c=document.createElement('canvas');c.width=c.height=n;
      var x=c.getContext('2d'),d=x.createImageData(n,n);
      for(var j=0;j<n;j++)for(var i=0;i<n;i++){var u=i/(n-1)*2-1,v=j/(n-1)*2-1,r2=(u*u+v*v)*.5,o=(j*n+i)*4;
        d.data[o]=127.5+127.5*u*r2;d.data[o+1]=127.5+127.5*v*r2;d.data[o+2]=127;d.data[o+3]=255}
      x.putImageData(d,0,0);map.setAttribute('href',c.toDataURL());root.dataset.crtReady=''}
    crtWatch()}
  // A safety net for slow machines: once the bend shows, time 120 frames; if the median frame takes over 22 ms, drop
  // only the bend (lines, vignette, glare and glow stay) for the rest of this session, without going back and forth.
  var crtWatching=false;
  function crtWatch(){var key='yourwave.crt-bend';
    try{if(sessionStorage.getItem(key)==='off')root.dataset.crtBend='off'}catch(e){}
    if(crtWatching||state.crt!=='on'||root.dataset.crtBend==='off'||!matchMedia(BEND).matches)return;
    crtWatching=true;var last=0,times=[];
    requestAnimationFrame(function frame(now){
      if(state.crt!=='on'){crtWatching=false;return}
      if(document.hidden)last=0;else{if(last)times.push(now-last);last=now}
      if(times.length<120){requestAnimationFrame(frame);return}
      times.sort(function(a,b){return a-b});
      if(times[60]>22){root.dataset.crtBend='off';try{sessionStorage.setItem(key,'off')}catch(e){}}})}
  function apply(){root.dataset.timeFormat=state.timeFormat;root.dataset.crt=state.crt;crtBend();root.dataset.timelineEffect=state.timelineEffect;root.dataset.presentation=state.presentation;var c=colors();tokens.forEach(function(t,i){root.style.setProperty('--'+t,c[i])});root.dataset.theme=mode();root.style.colorScheme=mode();
    if(readable(state.accent))accent(state.accent);
  }
  function save(){try{localStorage.setItem(key,JSON.stringify(state));saveError=false}catch(e){saveError=true}}
  function el(id){return document.getElementById(id)}
  var BEND='(min-width:701px) and (not (pointer:coarse)) and (not (prefers-contrast:more))';  // where theme.css bends
  function message(text){el('appearance-status').textContent=text||''}
  function render(){if(!mounted)return;
    el('appearance-presentation').value=state.presentation;
    el('appearance-time-format').value=state.timeFormat;
    el('appearance-timeline-effect').value=state.timelineEffect;
    el('appearance-crt').checked=state.crt==='on';
    document.querySelectorAll('[name="appearance-mode"]').forEach(function(n){n.checked=n.value===state.mode});
    document.querySelectorAll('[name="appearance-palette"]').forEach(function(n){n.checked=n.value===state.palette});
    Object.keys(palettes).forEach(function(name){var p=palettes[name][mode()],n=el('palette-'+name);n.style.setProperty('--sample-bg',p[0]);n.style.setProperty('--sample-ink',p[2]);n.style.setProperty('--sample-accent',p[5])});
    el('accent-hex').value=state.accent||colors()[5];el('accent-picker').value=hex(state.accent)?state.accent:colors()[5];
    el('accent-hex').setAttribute('aria-invalid','false');el('accent-apply').disabled=true;
    el('accent-feedback').textContent='Preview a colour, then apply. Text contrast must be at least 4.5:1.';
    message(saveError?'Changed for this tab; your browser could not save the preference.':state.accent&&!readable(state.accent)?'Your accent needs more contrast in this theme. The theme accent is shown; choose another colour below.':'Saved on this device.');
  }
  function change(){apply();save();render()}
  function preview(value){el('accent-hex').value=value;var valid=readable(value);apply();
    el('accent-hex').setAttribute('aria-invalid',String(!valid));el('accent-apply').disabled=!valid;
    if(valid){accent(value);el('accent-picker').value=value;
      el('accent-feedback').textContent='Preview · '+Math.min(contrast(value,colors()[0]),contrast(value,colors()[1])).toFixed(1)+':1 contrast. Apply to keep this colour.';
    }else el('accent-feedback').textContent=hex(value)?'Not enough contrast. Choose a '+(mode()==='dark'?'lighter':'darker')+' colour. Your saved accent is still in use.':'Enter a colour as #RRGGBB. Your saved accent is still in use.';
  }
  try{var saved=JSON.parse(localStorage.getItem(key));if(saved&&typeof saved==='object'){
    if(['system','light','dark'].indexOf(saved.mode)>=0)state.mode=saved.mode;
    if(Object.prototype.hasOwnProperty.call(palettes,saved.palette))state.palette=saved.palette;
    if(hex(saved.accent))state.accent=saved.accent;
    if(saved.timeFormat==='12')state.timeFormat='12';
    if(saved.presentation==='terminal')state.presentation='terminal';
    if(['off','fade','line'].indexOf(saved.timelineEffect)>=0)state.timelineEffect=saved.timelineEffect;
    if(saved.crt==='off')state.crt='off';  // on, and the old presets subtle, classic and heavy, all mean on
  }}catch(e){}
  apply();
  system.addEventListener('change',function(){if(state.mode==='system'){apply();render()}});
  return {formatTime:function(value){
    if(state.timeFormat!=='12'||!/^\d{2}:\d{2}$/.test(value))return value;
    var hour=+value.slice(0,2);return String(hour%12||12).padStart(2,'0')+value.slice(2)+(hour<12?' AM':' PM');
  },mount:function(){mounted=true;
    el('appearance-time-format').onchange=function(){state.timeFormat=this.value;change();timeline();directionView(true)};
    el('appearance-timeline-effect').onchange=function(){state.timelineEffect=this.value;change();el('tl').getAnimations({subtree:true}).forEach(function(a){a.cancel()})};
    el('appearance-presentation').onchange=function(){state.presentation=this.value;change();player()};
    el('appearance-crt').onchange=function(){state.crt=this.checked?'on':'off';change()};
    document.querySelectorAll('[name="appearance-mode"]').forEach(function(n){n.onchange=function(){state.mode=n.value;change()}});
    document.querySelectorAll('[name="appearance-palette"]').forEach(function(n){n.onchange=function(){state.palette=n.value;change()}});
    el('accent-picker').oninput=function(){preview(this.value)};
    el('accent-hex').oninput=function(){preview(this.value.trim())};
    el('accent-form').onsubmit=function(e){e.preventDefault();var value=el('accent-hex').value.trim();if(!readable(value))return;state.accent=value.toLowerCase();change()};
    el('accent-default').onclick=function(){state.accent='';change()};
    el('appearance-reset').onclick=function(){state={mode:'system',palette:'ember',accent:'',presentation:'calm',timelineEffect:'line',timeFormat:'24',crt:'on'};change();timeline();directionView(true)};
    el('accent-cancel').onclick=function(){apply();render()};
    el('appearance-custom').addEventListener('toggle',function(){if(!this.open){apply();render()}});
    el('accent-form').onkeydown=function(e){if(e.key==='Escape'){apply();render();el('appearance-custom').open=false;el('appearance-custom').querySelector('summary').focus()}};
    crtBend();render();
  }};
})();
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><filter id="crt" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feImage id="crt-map" preserveAspectRatio="none" result="map"/><feDisplacementMap id="crt-bend" in="SourceGraphic" in2="map" scale="35" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<!--appearance-->
      <div class="row appearance-heading"><h2 id="appearance-heading">Appearance</h2><button id="appearance-reset" type="button">Reset</button></div>
      <label for="theme-select">Theme</label>
      <select id="theme-select" aria-label="Theme" aria-describedby="theme-note"></select>
      <p class="l" id="theme-note"></p>
      <label for="appearance-time-format">Time format</label>
      <select id="appearance-time-format"><option value="24">24-hour · 14:30</option><option value="12">12-hour · 02:30 PM</option></select>
      <label for="appearance-presentation">Player style</label>
      <select id="appearance-presentation" aria-describedby="presentation-hint"><option value="calm">Calm</option><option value="terminal">Terminal</option></select>

      <label for="appearance-timeline-effect">Timeline effect</label>
      <select id="appearance-timeline-effect" aria-describedby="timeline-effect-hint"><option value="off">Off</option><option value="fade">Fade</option><option value="line" selected>Terminal line print</option></select>
      <label for="appearance-crt"><input type="checkbox" role="switch" id="appearance-crt" aria-label="CRT screen" aria-describedby="crt-hint" checked> CRT screen</label>
      <p id="crt-hint" class="l">On phones the effect is reduced to light lines and a vignette.</p>
      <details class="control-help"><summary>About appearance</summary>
        <p id="presentation-hint" class="l">Terminal adds an ASCII callsign and live broadcast status.</p>
        <p id="timeline-effect-hint" class="l">Effects apply to new broadcast rows. Saved in this browser; reduced motion disables animation.</p>
      </details>
      <fieldset class="appearance-mode"><legend>Mode</legend><div class="row">
        <label><input type="radio" name="appearance-mode" value="system" checked> System</label>
        <label><input type="radio" name="appearance-mode" value="light"> Light</label>
        <label><input type="radio" name="appearance-mode" value="dark"> Dark</label>
      </div></fieldset>
      <fieldset><legend>Palette</legend><div class="appearance-palettes">
        <label id="palette-ember" class="palette-choice"><span class="palette-sample" aria-hidden="true"><span>Aa</span><i></i></span><span><input type="radio" name="appearance-palette" value="ember" checked> Ember</span></label>
        <label id="palette-forest" class="palette-choice"><span class="palette-sample" aria-hidden="true"><span>Aa</span><i></i></span><span><input type="radio" name="appearance-palette" value="forest"> Forest</span></label>
        <label id="palette-ocean" class="palette-choice"><span class="palette-sample" aria-hidden="true"><span>Aa</span><i></i></span><span><input type="radio" name="appearance-palette" value="ocean"> Ocean</span></label>
      </div></fieldset>
      <p id="appearance-status" class="l" role="status" aria-live="polite"></p>
      <details id="appearance-custom"><summary>Custom accent</summary>
        <form id="accent-form">
          <label for="accent-hex">Accent colour</label>
          <div class="row accent-inputs"><input id="accent-picker" type="color" aria-label="Choose accent colour" value="#c2410c"><input id="accent-hex" type="text" value="#c2410c" maxlength="7" spellcheck="false" autocomplete="off" aria-describedby="accent-feedback" aria-invalid="false"></div>
          <p class="l" id="accent-feedback" role="status" aria-live="polite"></p>
          <div class="row"><button id="accent-apply" type="submit" disabled>Apply accent</button><button id="accent-cancel" type="button">Cancel</button><button id="accent-default" type="button">Use theme accent</button></div>
        </form>
      </details>
    <!--/appearance--><!--layout-->
<script src="/ui/core/model.js"></script>
<script src="/ui/themes/terminal/view.js"></script>
<script>RadioTheme.mount(RadioCore.create({token:"__TOKEN__",localControl:"__LOCAL_CONTROL__"==="true",theme:"terminal"}),document.body);</script>
</body>
</html>
